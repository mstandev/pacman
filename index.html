<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050812">
  <title>Pac-Man — Arcade</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #050812; color: #f8f7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 50% 35%, #111b35 0, #080d1a 38%, #050812 75%); }
    .cabinet { width: min(100%, 760px); }
    .topline { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 0 auto 10px; max-width: 560px; }
    .brand { color: #ffe500; font-weight: 900; letter-spacing: .18em; font-size: clamp(20px, 4vw, 28px); text-shadow: 0 0 18px #ffe50055; }
    .edition { color: #7786aa; text-transform: uppercase; font-size: 10px; letter-spacing: .17em; text-align: right; }
    .screen { position: relative; display: flex; justify-content: center; margin: auto; width: min(100%, 560px); aspect-ratio: 28 / 31; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    canvas { display: block; width: auto; height: auto; max-width: 100%; aspect-ratio: 28 / 31; margin: auto; image-rendering: pixelated; background: #000; }
    .actor-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .wall-overlay { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; background: transparent; }
    .actor-marker { position: absolute; transform: translate(-50%, -50%); }
    .pacman-marker { border-radius: 50%; background: #ffe500; box-shadow: 0 0 8px #ffe500aa; }
    .pacman-marker::after { content: ''; position: absolute; left: 50%; top: 50%; width: 62%; height: 62%; background: #000; clip-path: polygon(0 50%, 100% 0, 100% 100%); transform: translateY(-50%) rotate(var(--mouth-angle, 180deg)); transform-origin: 0 50%; }
    .pacman-marker.sprite { border-radius: 0; background-color: transparent; background-repeat: no-repeat; box-shadow: none; mix-blend-mode: screen; transform: translate(-50%, -50%) rotate(var(--facing, 0deg)); }
    .pacman-marker.sprite::after { display: none; }
    .pacman-marker.dead { transform: translate(-50%, -50%) rotate(var(--facing, 0deg)); box-shadow: none; }
    .ghost-marker { background: var(--ghost-color); border-radius: 50% 50% 4% 4%; clip-path: polygon(0 24%, 12% 0, 50% 0, 88% 0, 100% 24%, 100% 100%, 75% 82%, 50% 100%, 25% 82%, 0 100%); }
    .ghost-marker.frightened { background: #254ce9; }
    .ghost-marker.sprite { background-color: transparent; background-repeat: no-repeat; border-radius: 0; clip-path: none; mix-blend-mode: screen; }
    .ghost-marker.sprite .eye { display: none; }
    .ghost-marker.eyes { --ghost-color: #f1eee5; background: #f1eee5; border-radius: 50%; clip-path: none; }
    .ghost-marker .eye { position: absolute; top: 28%; width: 26%; height: 38%; border-radius: 50%; background: #fff; }
    .ghost-marker .eye:first-child { left: 22%; }.ghost-marker .eye:last-child { right: 22%; }
    .ghost-marker .eye i { position: absolute; top: 42%; left: 38%; width: 42%; height: 42%; border-radius: 50%; background: #173cbd; }
    .ghost-marker .eye i { transform: translate(var(--eye-x, 0), var(--eye-y, 0)); }
    .ghost-marker.frightened .eye { display: none; }
    .ghost-marker.eyes { background: transparent; clip-path: none; }
    .ghost-marker.eyes .eye { display: block; }
    .pacman-marker.dead-fold { background-color: #ffe500; background-image: none !important; border-radius: 50%; mix-blend-mode: screen; -webkit-mask-image: conic-gradient(from 28deg, transparent 0deg var(--death-gap), #000 var(--death-gap) 360deg); mask-image: conic-gradient(from 28deg, transparent 0deg var(--death-gap), #000 var(--death-gap) 360deg); }
    .points-marker { width: 32px; min-height: 14px; color: #fff; font: 700 8px ui-monospace, monospace; line-height: 14px; text-align: center; text-shadow: 0 0 4px #fff; white-space: nowrap; }
    .stats { width: min(100%, 560px); margin: 12px auto 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; color: #aeb8d0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 5px; color: #fff; font-size: 18px; letter-spacing: .02em; }
    .stat:nth-child(2) { text-align: center; }
    .stat:last-child { text-align: right; }
    .status { color: #ffe500; font-size: 11px; letter-spacing: .13em; text-align: center; min-height: 22px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .level-lives { color: #8490aa; font-size: 9px; letter-spacing: .08em; line-height: 1; white-space: nowrap; }
    .bottom { width: min(100%, 560px); margin: 12px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .help { color: #8490aa; font: 11px/1.65 system-ui, sans-serif; }
    kbd { color: #dce4f7; border: 1px solid #354264; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; font: 10px ui-monospace, monospace; }
    button { color: #07101d; background: #ffe500; border: 0; border-radius: 4px; padding: 10px 14px; font: 800 11px ui-monospace, monospace; letter-spacing: .1em; cursor: pointer; }
    button:hover { background: #fff06a; }
    .touch { display: none; width: 150px; grid-template: repeat(3, 42px) / repeat(3, 42px); gap: 4px; margin: 18px auto 0; }
    .touch button { padding: 0; font-size: 18px; background: #151e35; color: #f5dc42; border: 1px solid #34466f; touch-action: none; }
    .touch button:active { background: #26385f; }
    .touch .up { grid-area: 1 / 2; }.touch .left { grid-area: 2 / 1; }.touch .down { grid-area: 2 / 2; }.touch .right { grid-area: 2 / 3; }
    @media (pointer: coarse) { .touch { display: grid; } }
    @media (max-width: 520px) { body { padding: 10px 12px; }.bottom { align-items: start; } }
  </style>
</head>

        <div class="actor-marker ghost-marker" data-ghost="inky" style="--ghost-color:#20dafa"><span class="eye"><i></i></span><span class="eye"><i></i></span></div>
        <div class="actor-marker ghost-marker" data-ghost="clyde" style="--ghost-color:#ff9b21"><span class="eye"><i></i></span><span class="eye"><i></i></span></div>
        <div class="actor-marker points-marker" id="points-marker"></div>
      </div>
      <canvas class="wall-overlay" id="wall-overlay" width="224" height="248" aria-hidden="true"></canvas>
    </div>
    <section class="stats" aria-live="polite">
      <div class="stat">Score<span class="stat-value" id="score">000000</span></div>
      <div class="status" id="status"><span id="status-message">READY</span></div>
      <div class="stat">Best<span class="stat-value" id="best">000000</span></div>

        pacSourceX=456+deathPacFrame*16;
      }else if(deathTime<DEATH_IMPACT+DEATH_FOLD){
        deathFold=true;pacSourceX=488;pacAngle=0;
        const progress=clamp((deathTime-DEATH_IMPACT)/DEATH_FOLD,0,1);
        pacMarker.style.setProperty('--death-gap',`${28+progress*330}deg`);
      }else if(deathTime<DEATH_IMPACT+DEATH_FOLD+DEATH_SPARK){
        pacSourceX=664;pacAngle=0;
        const progress=(deathTime-DEATH_IMPACT-DEATH_FOLD)/DEATH_SPARK;
        pacSize=16+progress*4;
      }else{
        pacOpacity=0;
      }
    }
    place(pacMarker,player,pacSize,pacSize);
    pacMarker.classList.toggle('sprite',imageReady);
    pacMarker.classList.toggle('dead-fold',deathFold);
    pacMarker.style.setProperty('--death-opacity',String(pacOpacity));
    pacMarker.style.opacity=String(pacOpacity);
    pacMarker.style.setProperty('--facing',`${pacAngle}deg`);
    pacMarker.style.setProperty('--mouth-angle',`${pacAngle}deg`);
    if(imageReady){
      const spriteScale=imageScale*(pacSize/16);
      if(pacMarker.dataset.spriteReady!=='true'){
        pacMarker.style.backgroundImage=sheetImage;
        pacMarker.dataset.spriteReady='true';
      }
      pacMarker.style.backgroundSize=`${680*spriteScale}px ${248*spriteScale}px`;
      pacMarker.style.backgroundPosition=`-${pacSourceX*spriteScale}px -${pacSourceY*spriteScale}px`;
    }else pacMarker.style.backgroundImage='';
    pacMarker.classList.toggle('dead',state==='dead');
    ghostMarkers.forEach((node,index)=>{
      const ghost=ghosts[index];if(!ghost)return;
      place(node,ghost,16,16);
      node.classList.toggle('frightened',frightened>0&&!ghost.eyes);
      node.classList.toggle('eyes',ghost.eyes);
      node.classList.toggle('sprite',imageReady&&!ghost.eyes);
      if(imageReady&&!ghost.eyes){
        const frame=state==='dead'||ghostFreeze>0?0:Math.floor(elapsed*7)%2;
        const sourceX=frightened>0?584+frame*16:456+frame*16;
        const sourceY=frightened>0?64:64+index*16;
        const spriteScale=imageScale;
        if(node.dataset.spriteReady!=='true'||!node.style.backgroundImage){
          node.style.backgroundImage=sheetImage;
          node.dataset.spriteReady='true';
        }
        node.style.backgroundSize=`${680*spriteScale}px ${248*spriteScale}px`;
        node.style.backgroundPosition=`-${sourceX*spriteScale}px -${sourceY*spriteScale}px`;
      }else node.style.backgroundImage='';
      const look=directions[ghost.dir]||[0,0];
      node.style.setProperty('--eye-x',`${look[0]*imageScale}px`);
      node.style.setProperty('--eye-y',`${look[1]*imageScale}px`);
      const hiddenByDeath=state==='dead'&&deathTime>=DEATH_IMPACT;
      node.style.opacity=hiddenByDeath||(ghostFreeze>0&&ghost.eyes)?'0':'1';
    });
    const showingPoints=ghostFreeze>0&&ghostEatScore>0;
    if(pointsMarker){
      place(pointsMarker,{x:ghostEatX,y:ghostEatY},32,14);
      pointsMarker.textContent=String(ghostEatScore);
      pointsMarker.style.opacity=showingPoints?'1':'0';
    }
  }
  function fitCanvas(){
    const touchControls=matchMedia('(pointer: coarse)').matches?150:0;
    const viewportWidth=window.innerWidth||720,viewportHeight=window.innerHeight||800;
    const availableWidth=Math.max(1,Math.min(viewportWidth-32,560));
    const availableHeight=viewportHeight>400?Math.max(300,viewportHeight-200-touchControls):620;
    const width=Math.min(availableWidth,availableHeight*28/31,560);
    const height=width*31/28;
    screen.style.width=`${width}px`;
    screen.style.height=`${height}px`;
    canvas.style.width=`${width}px`;
    canvas.style.height=`${height}px`;
  }
  function setDirection(d){
    if(!directions[d]||state==='ready'||state==='dead'||state==='paused'||state==='clearing'||ghostFreeze>0)return;
    if(state==='over'){startGame(true);return;}
    player.want=d;
    if(player.dir&&d===opposite[player.dir]){
      if(player.toX!=null){const oldToX=player.toX,oldToY=player.toY;player.toX=player.fromX;player.toY=player.fromY;player.fromX=oldToX;player.fromY=oldToY;}
      player.dir=d;
    }
  }
  function startGame(reset=false){
    if(state==='over'||reset){score=0;lives=3;level=1;extraLife=false;initializeMaze();dotCount=0;fruits=[];resetRound(true);updateHUD();}
    state='ready';readyTime=0;elapsed=0;statusEl.textContent='READY';syncActors();
  }
  addEventListener('keydown',e=>{
    const map={ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowUp:'up',KeyW:'up'};
    if(map[e.code]){e.preventDefault();setDirection(map[e.code]);}
    if(e.code==='Space'){e.preventDefault();if(state==='playing'){state='paused';statusEl.textContent='PAUSED';}else if(state==='paused'){state='playing';statusEl.textContent='';}}
  });
  addEventListener('keyup',e=>{
    const map={ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowUp:'up',KeyW:'up'};
    if(state==='playing'&&ghostFreeze===0&&map[e.code]&&player?.want===map[e.code])player.want=null;
  });
  document.querySelectorAll('[data-dir]').forEach(b=>{
    const d=b.dataset.dir;
    b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(d);});
    const release=()=>{if(state==='playing'&&ghostFreeze===0&&player?.want===d)player.want=null;};
    b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('pointerleave',release);
  });
  window.addEventListener('resize',fitCanvas,{passive:true});
  fitCanvas();
  function frame(t){const dt=Math.min(.04,(t-lastTime)/1000||0);lastTime=t;update(dt);draw();requestAnimationFrame(frame);}
  initializeMaze();resetRound(true);state='ready';updateHUD();syncActors();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
